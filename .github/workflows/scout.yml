name: scout
# Weekly: adds new suggestions to proposals.json from the Competitors scores. Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/scout.mjs
      - name: Commit if the suggestions changed
        run: |
          git config user.name "roadmap-scout"
          git config user.email "roadmap-scout@users.noreply.github.com"
          git add proposals.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "Scout: refresh suggestions"
          git push -q origin HEAD:main
